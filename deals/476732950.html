if(D.images.length){ $('#photos').hidden=false; let i=0; const show=()=>{$('#big').src=D.images[i]; $('#cnt').textContent=(i+1)+' / '+D.images.length; [...$('#thumbs').children].forEach((t,k)=>t.classList.toggle('on',k===i));};
  $('#thumbs').innerHTML=D.images.map((u,k)=>`<img src="${u.replace('/1600w/','/240w/')}" data-i="${k}">`).join(''); $('#thumbs').onclick=e=>{ if(e.target.dataset.i!=null){i=+e.target.dataset.i;show();} };

(function(){ const c=$('#map'); if(!D.lat){ $('#mapsec').hidden=true; return; } const home=[63.4305,10.3951], to=[D.lat,D.lon];
  const st={cx:(home[1]+to[1])/2, cy:(home[0]+to[0])/2, zoom:0}; let W,H;
  function size(){ const dpr=devicePixelRatio||1; W=c.clientWidth; H=c.clientHeight||380; c.width=W*dpr; c.height=H*dpr; c.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
    if(!st.zoom){ const span=Math.max(3, Math.abs(home[0]-to[0])+2, Math.abs(home[1]-to[1])*0.5+2); st.zoom=H/span; } }
  const P=(lat,lon)=>[W/2+(lon-st.cx)*st.zoom*Math.cos(st.cy*Math.PI/180), H/2-(lat-st.cy)*st.zoom];
  function render(){ const x=c.getContext('2d'); x.clearRect(0,0,W,H); x.fillStyle='#0d0620'; x.fillRect(0,0,W,H);
    for(const country of NORDIC){ const nor=country.n==='Norway'; for(const ring of country.r){ x.beginPath(); ring.forEach(([lon,lat],i)=>{const [px,py]=P(lat,lon); i?x.lineTo(px,py):x.moveTo(px,py);}); x.closePath(); x.fillStyle=nor?'#3a1d66':'#241239'; x.fill(); x.strokeStyle=nor?'#8d5ccb':'#3f2a5e'; x.lineWidth=nor?1.2:.7; x.stroke(); } }

    const mark=(ll,g,col)=>{const [px,py]=P(ll[0],ll[1]); x.fillStyle=col; x.font='bold 15px sans-serif'; x.textAlign='center'; x.fillText(g,px,py+5);}; mark(home,'⌂','#e8dff7'); mark(to,'◆','#ff5c8a');
    if(D.route&&D.route.seconds){ x.fillStyle='#e8dff7'; x.font='13px monospace'; x.textAlign='left'; x.fillText(`${Math.floor(D.route.seconds/3600)} h ${Math.round(D.route.seconds%3600/60)} min drive · ${Math.round(D.route.metres/1000)} km`, 12, H-12); } }

  c.onwheel=e=>{e.preventDefault(); st.zoom*=e.deltaY<0?1.2:1/1.2; render();}; let drag=null;
  c.onmousedown=e=>{drag=[e.clientX,e.clientY];}; c.onmousemove=e=>{ if(!drag)return; st.cx-=(e.clientX-drag[0])/(st.zoom*Math.cos(st.cy*Math.PI/180)); st.cy+=(e.clientY-drag[1])/st.zoom; drag=[e.clientX,e.clientY]; render(); }; c.onmouseup=c.onmouseleave=()=>{drag=null;};
